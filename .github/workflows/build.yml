name: Build

on:
  pull_request:

jobs:
  build:
    # Vercel builds every non-dependabot PR itself; only run here for
    # dependabot/* branches, where vercel.json's ignoreCommand skips Vercel.
    if: startsWith(github.head_ref, 'dependabot/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm test

      - run: pnpm build
